name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android JVM tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

  shared:
    # 기존 main ruleset의 필수 검사 이름을 유지한다. 실제 iOS 테스트는 릴리스 검사에서 실행한다.
    name: iOS build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Run shared KMP and Android adapter JVM tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace
