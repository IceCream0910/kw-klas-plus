name: CI

on:
  push:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Android
        run: >-
          ./gradlew
          :shared:testAndroidHostTest
          :androidApp:testDebugUnitTest
          :androidApp:assembleDebug
          :androidApp:assembleDebugAndroidTest
          --stacktrace

  ios:
    name: iOS build and unit tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Xcode and project compatibility
        run: |
          xcodebuild -version
          xcodebuild -list -project iosApp/iosApp.xcodeproj

      - name: Run Kotlin Multiplatform iOS tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"]
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')"
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Build iOS unit tests
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosAppUnitTests
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "${{ runner.temp }}/ios-derived-data"
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run iOS unit tests
        timeout-minutes: 15
        env:
          NSUnbufferedIO: YES
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosAppUnitTests
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "${{ runner.temp }}/ios-derived-data"
          -only-testing:iosAppTests
          -parallel-testing-enabled NO
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 60
          -maximum-test-execution-time-allowance 120
          -resultBundlePath "${{ runner.temp }}/ios-unit-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test-without-building

      - name: Upload iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-results
          path: ${{ runner.temp }}/ios-unit-tests.xcresult
          if-no-files-found: ignore

      - name: Shut down iOS simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true
