name: Release validation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live_media:
        description: '배포 데모 영상 재생도 확인'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-release:
    name: Android release build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and AAB
        run: >-
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease
          -PsentryAutoUpload=false
          -x :androidApp:uploadSentryProguardMappingsRelease
          -x :androidApp:uploadSentryNativeSymbolsForRelease
          --stacktrace

      - name: Verify ProGuard UUID and mapping artifacts
        shell: python
        run: |
          from pathlib import Path
          from uuid import UUID
          from zipfile import ZipFile

          root = Path('androidApp/build')
          mapping = root / 'outputs/mapping/release/mapping.txt'
          assert mapping.is_file() and mapping.stat().st_size > 0, 'Missing R8 mapping'
          generated = root / 'intermediates/sentry/release/proguard-uuid/sentry-proguard-uuid.properties'
          expected = generated.read_text().strip().split('=', 1)[1]
          UUID(expected)
          for pattern, entry in [
              ('outputs/apk/release/*.apk', 'assets/sentry-debug-meta.properties'),
              ('outputs/bundle/release/*.aab', 'base/assets/sentry-debug-meta.properties'),
          ]:
              artifacts = list(root.glob(pattern))
              assert len(artifacts) == 1, f'Expected one artifact: {pattern}'
              with ZipFile(artifacts[0]) as archive:
                  properties = dict(
                      line.split('=', 1)
                      for line in archive.read(entry).decode().splitlines()
                      if '=' in line and not line.startswith('#')
                  )
              assert properties.get('io.sentry.ProguardUuids') == expected, 'ProGuard UUID mismatch'
              print(f'{artifacts[0].name}: ProGuard UUID {expected}')

      - name: Upload Android release artifacts for manual symbol upload
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/
            androidApp/build/outputs/native-debug-symbols/release/
            androidApp/build/intermediates/sentry/release/proguard-uuid/
            androidApp/build/intermediates/assets/release/injectSentryDebugMetaPropertiesIntoAssetsRelease/sentry-debug-meta.properties

  ios-release:
    name: iOS release build
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Archive iOS Release for device
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath '${{ runner.temp }}/ios-release.xcarchive'
          -derivedDataPath '${{ runner.temp }}/ios-release-derived-data'
          CODE_SIGNING_ALLOWED=NO
          SENTRY_AUTO_UPLOAD=false
          archive

      - name: Verify app, widget and debug symbols
        shell: bash
        run: |
          archive='${{ runner.temp }}/ios-release.xcarchive'
          app="$archive/Products/Applications/KLAS+.app"
          test -d "$app/PlugIns/LibraryQRWidget.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")" = KLASPlus
          test -x "$app/KLASPlus"
          test -n "$(find "$archive/dSYMs" -name '*.dSYM' -print -quit)"

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.sha }}
          path: ${{ runner.temp }}/ios-release.xcarchive
          if-no-files-found: error
          retention-days: 30

  android-e2e:
    name: Android emulator E2E and instrumentation
    env:
      E2E_TELEMETRY_DISABLED: '1'
      E2E_LIVE_MEDIA: ${{ inputs.live_media || false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare simulator builds and test runner
        run: |
          npm ci --prefix e2e
          ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --stacktrace

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on a fresh Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install androidApp/build/outputs/apk/debug/androidApp-debug.apk
            E2E_ANDROID_DEVICE="$ANDROID_SERIAL" bash e2e/run-ci.sh android
            adb shell pm clear com.icecream.kwklasplus
            ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace

      - name: Summarize Android test results
        if: always()
        run: python3 scripts/ci-test-summary.py junit 'e2e/.e2e/junit.xml' 'androidApp/build/outputs/androidTest-results/connected/**/*.xml'

      - name: Upload android E2E traces and screenshots
        id: e2e-diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-failure-${{ github.run_attempt }}
          path: e2e/.e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Link failure evidence in the job summary
        if: failure() && steps.e2e-diagnostics.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.e2e-diagnostics.outputs.artifact-url }}
        run: echo "[Tester Army failure evidence](${ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        id: android-platform-diagnostics
        if: failure()
        with:
          name: android-simulator-diagnostics
          path: |
            androidApp/build/outputs/androidTest-results/connected/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Link Android instrumentation evidence
        if: failure() && steps.android-platform-diagnostics.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.android-platform-diagnostics.outputs.artifact-url }}
        run: echo "[Android 계측 테스트 결과](${ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"

  ios-platform:
    name: iOS simulator platform tests
    runs-on: macos-26
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build iOS app and test bundles
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosAppUnitTests
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ios-simulator-build"
          -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- SENTRY_AUTO_UPLOAD=false
          build-for-testing

      - name: Boot a dedicated iPhone simulator
        run: |
          udid=$(xcrun simctl create "KLAS-E2E-$GITHUB_RUN_ID" 'iPhone 17' com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "E2E_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Run Kotlin iOS platform tests
        run: ./gradlew :shared:iosSimulatorArm64Test --device "$E2E_IOS_DEVICE" --stacktrace

      - name: Run Swift platform tests
        timeout-minutes: 20
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosAppUnitTests
          -destination "platform=iOS Simulator,id=$E2E_IOS_DEVICE"
          -derivedDataPath "$RUNNER_TEMP/ios-simulator-build"
          -parallel-testing-enabled NO
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 60
          -maximum-test-execution-time-allowance 120
          -resultBundlePath "$RUNNER_TEMP/ios-platform-tests.xcresult"
          test-without-building

      - name: Summarize iOS platform tests
        if: always()
        run: |
          python3 scripts/ci-test-summary.py junit 'shared/build/test-results/iosSimulatorArm64Test/*.xml'
          python3 scripts/ci-test-summary.py xcresult "$RUNNER_TEMP/ios-platform-tests.xcresult"

      - uses: actions/upload-artifact@v4
        id: ios-platform-diagnostics
        if: failure()
        with:
          name: ios-simulator-diagnostics
          path: |
            ${{ runner.temp }}/ios-platform-tests.xcresult
            shared/build/test-results/iosSimulatorArm64Test/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Link iOS platform failure evidence
        if: failure() && steps.ios-platform-diagnostics.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.ios-platform-diagnostics.outputs.artifact-url }}
        run: echo "[iOS 플랫폼 테스트 결과](${ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete dedicated simulator
        if: always() && env.E2E_IOS_DEVICE != ''
        run: xcrun simctl delete "$E2E_IOS_DEVICE"

  ios-e2e:
    name: iOS simulator XCTest E2E
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build XCTest E2E
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ios-xctest-comparison"
          -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- SENTRY_AUTO_UPLOAD=false
          build-for-testing
      - name: Boot dedicated iPhone
        run: |
          udid=$(xcrun simctl create "KLAS-XCTest-$GITHUB_RUN_ID" 'iPhone 17' com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "XCTEST_DEVICE=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Run XCTest E2E
        env:
          E2E_LIVE_MEDIA: ${{ inputs.live_media || false }}
        run: |
          extra_args=()
          if [[ "$E2E_LIVE_MEDIA" != 'true' ]]; then
            extra_args+=('-skip-testing:iosAppUITests/DemoJourneyTests/testLiveMediaPlaybackAndSeek')
          fi
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination "platform=iOS Simulator,id=$XCTEST_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/ios-xctest-comparison" \
            -parallel-testing-enabled NO \
            -only-testing:iosAppUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            -resultBundlePath "$RUNNER_TEMP/ios-xctest-comparison.xcresult" \
            "${extra_args[@]}" test-without-building 2>&1 | tee "$RUNNER_TEMP/ios-xctest.log"
      - name: Summarize XCTest results
        if: always()
        run: python3 scripts/ci-test-summary.py xcresult "$RUNNER_TEMP/ios-xctest-comparison.xcresult"
      - uses: actions/upload-artifact@v4
        id: xctest-diagnostics
        if: failure()
        with:
          name: ios-xctest-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-xctest-comparison.xcresult
            ${{ runner.temp }}/ios-xctest.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Link XCTest failure evidence
        if: failure() && steps.xctest-diagnostics.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.xctest-diagnostics.outputs.artifact-url }}
        run: echo "[XCTest 실패 로그와 결과](${ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete dedicated simulator
        if: always() && env.XCTEST_DEVICE != ''
        run: xcrun simctl delete "$XCTEST_DEVICE"

  promote:
    name: Promote validated main commit to release
    if: github.ref == 'refs/heads/main'
    needs: [android-release, ios-release, android-e2e, ios-e2e, ios-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward release
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/release:refs/remotes/origin/release
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit has its own release validation run.'
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/release "$GITHUB_SHA"; then
            echo '::error::release cannot be fast-forwarded to the validated main commit.'
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/release"
